name: terraform-do

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-do.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "name=prod" >> $GITHUB_OUTPUT
            echo "droplet_name=buddy-prod-droplet" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
            echo "droplet_name=buddy-dev-droplet" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup duplicate droplets
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "${{ steps.env.outputs.droplet_name }}" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_TOKEN }}" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID"
            done

      - name: Terraform fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=buddy-terraform-state-${{ github.ref_name == 'main' && 'production' || 'development' }}" \
            -backend-config="endpoint=https://nyc3.digitaloceanspaces.com"

      - name: Import existing resources
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}
        run: |
          # Import firewall if exists
          FW_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.DO_TOKEN }}" \
            "https://api.digitalocean.com/v2/firewalls?page=1&per_page=200")
          FW_ID=$(echo "$FW_JSON" | jq -r --arg prefix "${{ steps.env.outputs.name }}-buddy-web-" '[.firewalls[] | select(.name | startswith($prefix))] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$FW_ID" ]; then
            echo "Importing firewall $FW_ID"
            terraform import -input=false module.digitalocean.digitalocean_firewall.web "$FW_ID" || echo "Firewall import failed"
          fi
          # Import DNS records
          for RECORD in app api; do
            DOMAIN="${RECORD}"
            if [ "$RECORD" = "app" ]; then
              DOMAIN="buddy.${{ steps.env.outputs.name == 'prod' && 'mainecybertech.com' || 'mainecybertech.us' }}"
            else
              DOMAIN="buddy-api.${{ steps.env.outputs.name == 'prod' && 'mainecybertech.com' || 'mainecybertech.us' }}"
            fi
            RECORD_JSON=$(curl -s -H "Authorization: Bearer $TF_VAR_cloudflare_api_token" \
              "https://api.cloudflare.com/client/v4/zones/$TF_VAR_cloudflare_zone_id/dns_records?type=A&name=$DOMAIN")
            RECORD_ID=$(echo "$RECORD_JSON" | jq -r '.result[0].id // empty')
            if [ -n "$RECORD_ID" ]; then
              RESOURCE="module.cloudflare.cloudflare_dns_record.$([ "$RECORD" = "app" ] && echo "app" || echo "api")"
              echo "Importing DNS $DOMAIN ($RECORD_ID) as $RESOURCE"
              terraform import -input=false "$RESOURCE" "$TF_VAR_cloudflare_zone_id/$RECORD_ID" || echo "DNS import failed"
            fi
          done

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}
        run: |
          if [ -z "${TF_VAR_cloudflare_zone_id}" ]; then
            echo "ERROR: CF_ZONE_ID secret is not set"
            exit 1
          fi
          if [ -z "${TF_VAR_ssh_key_fingerprint}" ]; then
            echo "ERROR: DO_SSH_KEY_FINGERPRINT secret is not set"
            exit 1
          fi
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}
        run: terraform apply -auto-approve tfplan