name: Release

# Tag-driven release. Publishing a `v*` tag builds and tests the app at the tagged
# commit, generates an SBOM and a changelog that records the exact commit, packages
# the build, attests its provenance, and publishes it as a GitHub Release. Every
# artifact is therefore bound to the commit the tag points at.
on:
  push:
    tags:
      - "v*"

# Least privilege by default. Dependency installation and the build run in the
# read-only `build` job; only the `publish` job receives the write scopes needed to
# create the GitHub Release and its provenance attestation (buddy-SUPPLY-001).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / test / package
    runs-on: ubuntu-latest
    # Require approval from the `release` environment's required reviewers before
    # this job (and therefore any publish step) runs (buddy-CI-002). The environment
    # and its protection rules are configured in GitHub settings; see
    # docs/release-process.md.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Record build id
        id: build
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short HEAD)"
            echo "tag=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Generate changelog
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "# Release ${GITHUB_REF_NAME}"
            echo
            echo "- Commit: ${{ steps.build.outputs.commit }}"
            echo "- Tag: ${GITHUB_REF_NAME}"
            echo
            if [ -n "$prev" ]; then
              echo "## Changes since ${prev}"
              git log --pretty=format:'- %h %s' "${prev}..${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              git log --pretty=format:'- %h %s'
            fi
            echo
          } > CHANGELOG-RELEASE.md

      - name: Package artifact
        run: tar -czf "buddy-${GITHUB_REF_NAME}.tar.gz" .next public package.json package-lock.json sbom.cdx.json CHANGELOG-RELEASE.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            buddy-${{ github.ref_name }}.tar.gz
            sbom.cdx.json
            CHANGELOG-RELEASE.md
          if-no-files-found: error

  publish:
    name: attest / publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "buddy-${{ github.ref_name }}.tar.gz"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG-RELEASE.md
          files: |
            buddy-${{ github.ref_name }}.tar.gz
            sbom.cdx.json
