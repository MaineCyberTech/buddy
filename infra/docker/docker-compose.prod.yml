name: buddy-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: buddy-caddy-prod
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - buddy-prod
    depends_on:
      - app

  app:
    image: ${GHCR_IMAGE_PREFIX}/buddy-app:${IMAGE_TAG}
    container_name: buddy-app-prod
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    networks:
      - buddy-prod

networks:
  buddy-prod:
    driver: bridge

volumes:
  caddy-data:
  caddy-config: